.lbl{color:var(--gray);}

#ascii{white-space:pre;text-align:center;color:var(--green);font-size:11px;line-height:1.1;margin-bottom:6px;}
#log{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:14px;min-height:60px;}
#log p{margin:4px 0;line-height:1.5;}
#choices{display:flex;flex-direction:column;gap:8px;}
button.choice{background:var(--panel2);border:1px solid var(--border);color:var(--white);
  padding:10px 14px;text-align:left;border-radius:5px;font-family:inherit;font-size:14px;cursor:pointer;}
button.choice:hover{border-color:var(--orange);background:#22252d;}
button.choice.danger{border-color:var(--red);}
button.choice.good{border-color:var(--green);}
.inputrow{display:flex;gap:8px;margin-top:6px;}
.inputrow input{flex:1;background:#0a0b0d;border:1px solid var(--border);color:var(--white);padding:8px;border-radius:5px;font-family:inherit;}
.inputrow button{background:var(--orange);border:none;color:#20130a;padding:8px 16px;border-radius:5px;font-weight:bold;cursor:pointer;}
.red{color:var(--red);} .orange{color:var(--orange);} .yellow{color:var(--yellow);}
.yellowpale{color:var(--yellowpale);} .green{color:var(--green);} .green2{color:var(--green2);}
.blue{color:var(--blue);} .purple{color:var(--purple);} .pink{color:var(--pink);}
.cyan{color:var(--cyan);} .gray{color:var(--gray);} .darkgray{color:var(--darkgray);}
.white{color:var(--white);} .brown{color:var(--brown);} .brownlight{color:var(--brownlight);}
table.grid{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
table.grid td{border:1px solid var(--border);padding:5px;text-align:center;color:var(--cyan);}
.footer{text-align:center;color:var(--darkgray);font-size:11px;padding:10px;}
::selection{background:var(--orange);color:#000;}
</style>
</head>

function getMob(key, level){

    const b=BOSS[key], i=tierIndex(level);
    return {name:b.label||key, atkname:b.atkname, loot:b.loot, health:b.t[i][0], atk:b.t[i][1], exp:b.t[i][2]};

  const [hB,hP,aB,aP,eB,eP]=m.t[i];
  let k;

    health:hB+hP*k, atk:aB+aP*k, exp:eB+eP*k};
}

/* ============================== INVENTAIRE ============================== */

function addItem(nom, type, qte){
  if(type==="Arme"||type==="Armure"){
    for(let i=0;i<30;i++) if(!INV.slots[i]){ INV.slots[i]={nom,type,qte:1}; return true; }
    return false;
  }
  const maxStack=30;
  for(let i=0;i<30 && qte>0;i++){
    const s=INV.slots[i];
    if(s && s.nom===nom && s.qte<maxStack){
      const libre=maxStack-s.qte;
      if(qte<=libre){ s.qte+=qte; qte=0; break; }
      s.qte=maxStack; qte-=libre;
    }
  }
  for(let i=0;i<30 && qte>0;i++){
    if(!INV.slots[i]){ const a=Math.min(qte,maxStack); INV.slots[i]={nom,type,qte:a}; qte-=a; }
  }
  return qte<=0;
}
function countItem(nom){ return INV.slots.reduce((s,x)=>x&&x.nom===nom?s+x.qte:s,0); }
function removeItem(nom, qte){
  if(countItem(nom)<qte) return false;
  let reste=qte;
  for(let i=0;i<30 && reste>0;i++){
    const s=INV.slots[i];
    if(s && s.nom===nom){
      if(s.qte<=reste){ reste-=s.qte; INV.slots[i]=null; } else { s.qte-=reste; reste=0; }
    }
  }
  return true;
}
function equipSlot(i){
  const it=INV.slots[i];
  if(!it) return "Ce slot est vide.";
  if(it.type!=="Arme" && it.type!=="Armure") return it.nom+" n'est pas un équipement.";
  if(it.type==="Arme"){ const old=INV.equip.arme; INV.equip.arme=it; INV.slots[i]=old; return "Vous avez équipé l'arme : "+it.nom; }
  const old=INV.equip.armure; INV.equip.armure=it; INV.slots[i]=old; return "Vous avez équipé la cape : "+it.nom;
}

/* ============================== NIVEAU ============================== */

function expRequise(level){ return 10+80*(level-1); }
function gainExp(exp){
  P.exp+=exp;
  let req=expRequise(P.level);
  let ups=[];
  while(P.exp>=req){
    P.level++; P.exp-=req;
    if(P.level<=10){ P.atk+=3; P.health+=15; } else if(P.level<=25){ P.atk+=7; P.health+=30; } else { P.atk+=30; P.health+=100; }
    req=expRequise(P.level);
    if(P.level<=10) P.title="Première Année"; else if(P.level<=20) P.title="Préfet"; else if(P.level<=30) P.title="Auror Junior";
    else if(P.level<=40) P.title="Auror Chevronné"; else if(P.level<=50) P.title="Maître des Sortilèges"; else P.title="Archimage Légendaire";
    ups.push(P.level);
  }
  return ups;
}

/* ============================== RENDU ============================== */

const logEl=document.getElementById('log'), choicesEl=document.getElementById('choices'), asciiEl=document.getElementById('ascii'), statEl=document.getElementById('statbar');

function esc(s){ return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function clearLog(){ logEl.innerHTML=""; }
function line(html, cls){ const p=document.createElement('p'); if(cls) p.className=cls; p.innerHTML=html; logEl.appendChild(p); }
function setChoices(list){
  choicesEl.innerHTML="";
  list.forEach(([label,fn,cls])=>{
    const b=document.createElement('button'); b.className="choice"+(cls?" "+cls:""); b.innerHTML=label;
    b.onclick=fn; choicesEl.appendChild(b);
  });
}
function setAscii(txt){ asciiEl.textContent=txt||""; }
function inputRow(placeholder, onSubmit, btnLabel){
  choicesEl.innerHTML="";
  const wrap=document.createElement('div'); wrap.className="inputrow";
  const inp=document.createElement('input'); inp.placeholder=placeholder;
  const btn=document.createElement('button'); btn.textContent=btnLabel||"OK";
  const go=()=>onSubmit(inp.value);
  btn.onclick=go; inp.onkeydown=(e)=>{ if(e.key==="Enter") go(); };
  wrap.appendChild(inp); wrap.appendChild(btn); choicesEl.appendChild(wrap);
  setTimeout(()=>inp.focus(),0);
}

function renderStatbar(){
  if(!P){ statEl.innerHTML=""; return; }
  statEl.innerHTML = `
    <div><span class="lbl">Nom</span> <b>${esc(P.name)}</b></div>
    <div><span class="lbl">Maison/Classe</span> ${esc(P.race)} ${esc(P.class)}</div>
    <div><span class="lbl">Niveau</span> ${P.level} <span class="gray">(${esc(P.title)})</span></div>
    <div><span class="lbl">HP</span> ${P.health}</div>
    <div><span class="lbl">Endurance</span> ${P.endurance}</div>
    <div><span class="lbl">Attaque</span> ${P.atk}</div>
    <div><span class="lbl">Gallions</span> <span class="yellow">${P.money} 🪙</span></div>
    <div><span class="lbl">Exp</span> ${P.exp}/${expRequise(P.level)}</div>
  `;
}

      askRace();
    }, "Valider");

    inputRow("Gryffondor / Serdaigle / Serpentard / Poufsouffle...", (v)=>{
      state.race=v.trim();
      line('<span class="purple">Le Choixpeau vous envoie à : </span>'+esc(state.race));

    inputRow("Mage / Cracmol / Moldu / Mage Noir...", (v)=>{

      finalize();

    const raceKey=state.race.toLowerCase().replace(/\s+/g,'');

    const raceData = RACES[raceKey];
    const classData = CLASSES[classKey];
    if(!raceData) line('<span class="darkgray">Maison non reconnue, statistiques de base appliquées.</span>');
    const healthRace = raceData?raceData.health:100, enduRace=raceData?raceData.endu:50, defRace=raceData?raceData.def:5, atk0=raceData?raceData.atk:10;
    const raceLabel = raceData?raceData.label:state.race;
    const healthClasse = classData?classData.health:0, enduClasse=classData?classData.endu:0, degClasse=classData?classData.deg:0;
    const classeLabel = classData?classData.label:"Aventurier";

    P = {
      name: state.nom, race: raceLabel, class: classeLabel, level:1,
      health: healthRace+healthClasse, endurance: enduRace+enduClasse, def: defRace+(classData?classData.def:0),
      money:5, exp:0, atk: degClasse+atk0, title:"Première Année",
    };
    INV = newInventaire();
    const armeDebut = classData?classData.arme:"Bâton d'Entraînement";
    addItem(armeDebut,"Arme",1);
    equipSlot(INV.slots.findIndex(s=>s && s.nom===armeDebut));

    clearLog();
    line('<span class="red">=== SORCIER PRÊT ===</span>');
    line(`<span class="orange">Bienvenue, ${esc(P.name)} de ${esc(P.race)}, ${esc(P.class)} !</span>`);
    line(`<span class="yellow">Santé : ${P.health} HP | Endurance : ${P.endurance} Pts | Gallions : ${P.money}</span>`);
    line('<span class="green">Appuyez sur le bouton pour rejoindre le village de Pré-au-Lard.</span>');
    renderStatbar();
    setChoices([["Entrer à Pré-au-Lard", ()=>screenVillage(), "good"]]);
  }
}

/* ============================== SYSTÈME DE COMBAT ============================== */

function startFight(mobKey, retourLieu, isBoss){
  const m0 = getMob(mobKey, P.level);
  const armorBonus = INV.equip.armure ? (PVARMURE[INV.equip.armure.nom]||0) : 0;
  fightState = {
    mobKey, retourLieu, isBoss,
    mHealth: m0.health, mHealthMax: m0.health,
    mAtkFull: m0.atk, mAtk: isBoss ? Math.floor(m0.atk/2) : m0.atk, halfReached:false,
    jHealth: P.health + armorBonus, jHealthMax: P.health + armorBonus,
    endu: P.endurance, forcePotion:false,
  };
  renderFight();
}

function classAttaques(){ return ATTAQUES_CLASSE[P.class] || ATTAQUES_CLASSE["Aventurier"]; }

function renderFight(){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  clearLog(); setAscii("⚔  D U E L  ⚔");
  line(`<span class="red">--------------- ${esc(P.name)} VS ${esc(m.name)} ---------------</span>`);
  line(`<span class="orange">Santé de ${esc(P.name)} : ${Math.max(0,fs.jHealth)} HP</span>`);
  line(`<span class="yellow">Santé de ${esc(m.name)} : ${Math.max(0,fs.mHealth)} HP</span>`);
  line(`<span class="blue">Endurance de ${esc(P.name)} : ${fs.endu}</span>`);
  const table=attaqueTable();
  const attaques=classAttaques();
  renderStatbar();
  const choices=attaques.map((nom,idx)=>{
    const a=table[nom];
    return [`${idx+1} - Lancer ${esc(nom)} (${a.deg} DGT, ${a.cout} Endu)`, ()=>doAttaque(idx)];
  });
  choices.push(["4 - Utiliser une potion", showFightPotions]);
  setChoices(choices);
}

function doAttaque(idx){
  const fs=fightState, attaques=classAttaques(), nom=attaques[idx], table=attaqueTable();
  const m=getMob(fs.mobKey,P.level);
  let msgs=[];
  if(fs.endu < table[nom].cout){
    const fallbackName = attaques[2];
    const punch=table[fallbackName].deg;
    fs.mHealth-=punch;
    msgs.push('<span class="blue">Vous n\'avez plus assez d\'endurance pour lancer ce sort !</span>');
    msgs.push(`<span class="brownlight">Vous ripostez avec ${esc(fallbackName)} et infligez ${punch} DGT</span>`);
  } else {
    let atk=table[nom].deg;
    let crit=false;
    if(Math.random()*100<10){ atk*=2; crit=true; }
    if(fs.forcePotion){ atk*=2; fs.forcePotion=false; msgs.push('<span class="green2">PHILTRE DE VIGUEUR ! Dégâts doublés !</span>'); }
    fs.mHealth-=atk;
    if(crit) msgs.push('💥 <b>COUP CRITIQUE !</b>');
    msgs.push(`<span class="red">${esc(P.name)} lance ${esc(nom)} : ${atk} DGT</span>`);
    fs.endu-=table[nom].cout;
  }
  applyMobTurnAndContinue(msgs);
}

function applyMobTurnAndContinue(msgs){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  if(fs.isBoss && !fs.halfReached && fs.mHealth<=fs.mHealthMax/2){
    fs.halfReached=true; fs.mAtk=fs.mAtkFull;
    msgs.push(`<span class="red">[!] ${esc(m.name)} a perdu la moitié de ses PV ! Il retrouve toute sa puissance !</span>`);
  }
  if(fs.mHealth>0){
    msgs.push(`<span class="orange">${esc(m.name)} lance ${esc(m.atkname)} et vous infligez ${fs.mAtk} DGT</span>`);
    fs.jHealth-=fs.mAtk;
  }
  clearLog(); setAscii("⚔  D U E L  ⚔");
  msgs.forEach(x=>line(x));
  renderStatbar();
  if(fs.jHealth<=0 || fs.mHealth<=0){
    setChoices([["Continuer...", resolveFight]]);
  } else {
    setChoices([["Continuer le duel...", renderFight]]);
  }
}

function showFightPotions(){
  const fs=fightState;
  clearLog(); setAscii("⚔  D U E L  ⚔");
  line('<span class="green2">1 - Utiliser Essence de Dictame</span>');
  line('<span class="green2">2 - Utiliser Potion Explosive</span>');
  line('<span class="green2">3 - Utiliser Philtre de Vigueur</span>');
  line('<span class="cyan">4 - Retour</span>');
  line(`<span class="gray">Fioles possédées — Dictame: ${countItem("Essence de Dictame")}, Explosive: ${countItem("Potion Explosive")}, Vigueur: ${countItem("Philtre de Vigueur")}</span>`);
  renderStatbar();
  setChoices([
    ["1 - Essence de Dictame", ()=>useFightPotion("Essence de Dictame")],
    ["2 - Potion Explosive", ()=>useFightPotion("Potion Explosive")],
    ["3 - Philtre de Vigueur", ()=>useFightPotion("Philtre de Vigueur")],
    ["4 - Retour", renderFight],
  ]);
}

function useFightPotion(nom){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  let msgs=[];
  if(nom==="Essence de Dictame"){
    if(removeItem(nom,1)){
      const heal=Math.floor(fs.jHealthMax/2);
      fs.jHealth+=heal;
      msgs.push(`<span class="green2">Essence de Dictame utilisée, vous récupérez ${heal} PV !</span>`);
    } else msgs.push('<span class="red">Vous n\'avez pas d\'Essence de Dictame !</span>');
  } else if(nom==="Potion Explosive"){
    if(removeItem(nom,1)){
      const dgt=P.atk*2; fs.mHealth-=dgt;
      msgs.push(`<span class="green2">Potion Explosive utilisée, vous infligez ${dgt} DGT !</span>`);
    } else msgs.push('<span class="red">Vous n\'avez pas de Potion Explosive !</span>');
  } else if(nom==="Philtre de Vigueur"){
    if(removeItem(nom,1)){
      fs.forcePotion=true;
      msgs.push('<span class="green2">Philtre de Vigueur utilisé, votre prochain sort sera doublé !</span>');
    } else msgs.push('<span class="red">Vous n\'avez aucun Philtre de Vigueur !</span>');
  }
  applyMobTurnAndContinue(msgs);
}

function resolveFight(){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  clearLog(); setAscii("");
  if(fs.jHealth<=0 && fs.mHealth<=0){ fightWin(); }
  else if(fs.jHealth<=0){ fightLose(); return; }
  else { fightWin(); }
}

function fightWin(){
  const fs=fightState, m=getMob(fs.mobKey,P.level);
  line(`<span class="green">Bravo ! Vous avez vaincu ${esc(m.name)} !</span>`);
  const ups=gainExp(m.exp);
  line(`<span class="green">+${m.exp} points d'expérience</span>`);
  ups.forEach(lvl=>line(`<span class="green2">Niveau supérieur ! Vous êtes maintenant niveau ${lvl} ! Vous êtes un ${esc(P.title)} !</span>`));
  if(addItem(m.loot,"Ressource",1)) line(`<span class="cyan">[+] ${esc(m.loot)} ajouté à l'inventaire !</span>`);
  renderStatbar();
  setChoices([["Retourner là où vous étiez", ()=> fs.isBoss ? screenVillage() : screenLieu(fs.retourLieu)]]);
}

function fightLose(){
  clearLog(); setAscii("💀");
  line('<span class="red">Vous avez été vaincu...</span>');
  P.level -= 1;
  if(P.level < 0){ return screenGameOver("Votre parcours à Poudlard s'achève ici..."); }
  line('<span class="red">Vous perdez 1 niveau.</span>');
  line(`<span class="red">Vous êtes maintenant niveau ${P.level}.</span>`);
  renderStatbar();
  setChoices([["Retourner à Pré-au-Lard", screenVillage]]);

  clearLog(); setAscii("W A S T E D");

  line('<span class="orange">Voici les recettes disponibles dans l\'atelier :</span>');
  RECETTES.forEach((r,i)=>{
    const ing=r.ing.map(([n,q])=>`${esc(n)} x${q} (vous: ${countItem(n)})`).join(", ");
    line(`<b>[${i+1}] ${esc(r.nom)}</b> (${esc(r.cat)}) — ${ing}`);
  });
  renderStatbar();
  const choices=RECETTES.map((r,i)=>[`Fabriquer : ${esc(r.nom)}`, ()=>doCraft(i)]);
  choices.push(["Retour", screenForge]);
  setChoices(choices);
}
function doCraft(i){
  const r=RECETTES[i];
  clearLog();
  let peut=true;
  for(const [n,q] of r.ing){ if(countItem(n)<q){ peut=false; line(`<span class="red">❌ Il vous manque des composants ! ${countItem(n)}/${q} ${esc(n)}.</span>`); break; } }
  if(peut){
    r.ing.forEach(([n,q])=>removeItem(n,q));
    addItem(r.nom, r.cat==="Armure"?"Armure":"Arme", 1);
    line(`<span class="green">🎉 Succès ! Vous avez enchanté : ${esc(r.nom)} !</span>`);
  }
  renderStatbar();
  setChoices([["Retour aux recettes", screenCraft]]);
}

/* ============================== LES TROIS BALAIS (auberge) ============================== */

function screenAuberge(){
  clearLog(); setAscii("🍺 T R O I S   B A L A I S 🍺");
  line('<span class="red">--------------- Les Trois Balais ---------------</span>');
  renderStatbar();
  setChoices([
    ["1 - Jouer à Pile ou Face (Gallion enchanté)", screenPileFace],
    ["2 - Boire une gorgée de la Fiole Mystérieuse", screenPotionMagique],
    ["3 - Ouvrir l'inventaire", ()=>screenInventaire(screenAuberge)],
    ["4 - Retourner à Pré-au-Lard", screenVillage],
    ["🗺 Voir la carte", ()=>screenMap(screenAuberge)],
  ]);
}
function screenPileFace(){
  clearLog(); setAscii("🪙");
  line('<span class="red">=== PILE OU FACE ===</span>');
  line(`<span class="yellow">Vous avez ${P.money} Gallions.</span>`);
  if(P.money<=0){ line('<span class="red">Vous n\'avez plus de Gallions pour jouer !</span>'); setChoices([["Retour aux Trois Balais", screenAuberge]]); return; }
  inputRow("Mise (0 pour quitter)...", (v)=>{
    const mise=parseInt(v,10);
    if(isNaN(mise)){ line('<span class="red">Nombre invalide.</span>'); setChoices([["Retour", screenPileFace]]); return; }
    if(mise===0){ screenAuberge(); return; }
    if(mise<0 || mise>P.money){ line('<span class="red">Mise invalide.</span>'); setChoices([["Retour", screenPileFace]]); return; }
    inputRow("Pile ou face ?", (choix)=>{
      choix=choix.trim().toLowerCase();
      if(choix!=="pile" && choix!=="face"){ line('<span class="red">Tapez exactement "pile" ou "face".</span>'); setChoices([["Retour", screenPileFace]]); return; }
      const resultat = Math.random()<0.5 ? "pile" : "face";
      clearLog();
      line(`<span class="blue">Le Gallion tourne dans les airs... et tombe sur : ${resultat} !</span>`);
      if(choix===resultat){ P.money+=mise; line(`<span class="green">Félicitations ! Vous gagnez ${mise} Gallions !</span>`); }
      else { P.money-=mise; line(`<span class="red">Dommage... Vous perdez ${mise} Gallions.</span>`); }
      line(`<span class="yellow">Il vous reste ${P.money} Gallions.</span>`);
      renderStatbar();
      setChoices([["Rejouer", screenPileFace],["Retour aux Trois Balais", screenAuberge]]);
    }, "Lancer");
  }, "Miser");
}
function screenPotionMagique(){
  clearLog(); setAscii("🧪");
  line('<span class="red">--------------- LA FIOLE MYSTÉRIEUSE ---------------</span>');
  line('<span class="gray">Un client louche vous propose une gorgée pour 5 Gallions. Personne ne sait vraiment ce qu\'elle contient...</span>');
  line(`<span class="yellow">Vous avez ${P.money} Gallions.</span>`);
  setChoices([
    ["Oui, je tente une gorgée", ()=>{
      if(P.money<5){ clearLog(); line('<span class="yellow">Vous n\'avez pas assez de Gallions (5 requis) !</span>'); setChoices([["Retour",screenAuberge]]); return; }
      P.money-=5; renderStatbar(); playPotionSequence();
    }],
    ["Non, j'ai changé d'avis", screenAuberge],
  ]);
}
function playPotionSequence(){
  const seq=[
    "Vous buvez une gorgée de la fiole...",
    "Vous commencez à ressentir ses effets...",
    "Vous vous rendez compte de quelque chose...",
    "Cette fiole n'était pas ce que vous pensiez...",
  ];
  let i=0;
  function step(){
    clearLog(); setAscii("🧪");
    line('<span class="purple">'+esc(seq[i])+'</span>');
    i++;
    if(i<seq.length){ setChoices([["Continuer", step]]); }
    else {
      P.health -= 1;
      if(P.health<=0){
        clearLog(); setAscii("💀");
        line('<span class="red">Cette gorgée vous aura été fatale...</span>');
        line('<span class="red">Vous n\'avez pas pu y survivre.</span>');
        setChoices([["..." , ()=>screenGameOver("W A S T E D")]]);
      } else {
        line(`<span class="purple">Vous venez de perdre un PV de façon définitive. Il vous reste ${P.health} PV max.</span>`);
        renderStatbar();
        setChoices([["Retour aux Trois Balais", screenAuberge]]);
      }
    }
  }
  step();
}

/* ============================== VIEILLE POTIONNISTE ============================== */

function screenWitch(retourKey){
  clearLog(); setAscii("🧙♀");
  line('<span class="pink">Hihihi... Un petit sorcier égaré dans mes brumes, hihihi !</span>');
  line('<span class="purple">Approche donc de mon chaudron, j\'ai de drôles de fioles dans ma besace.</span>');
  renderStatbar();
  setChoices([
    ["1 - Achat de fioles", ()=>screenWitchBuy(retourKey)],
    ["2 - Ouvrir l'inventaire", ()=>screenInventaire(()=>screenWitch(retourKey))],
    ["3 - Quitter la cabane de la Potionniste", ()=>screenLieu(retourKey)],
    ["🗺 Voir la carte", ()=>screenMap(()=>screenWitch(retourKey))],
  ]);
}
function screenWitchBuy(retourKey){
  clearLog(); setAscii("");
  line('<span class="red">--------------- ÉTAGÈRE DES FIOLES ---------------</span>');
  Object.entries(PRIX_POTIONS).forEach(([n,p])=>line(`<span class="yellow">${esc(n)} — ${p} Gallions l'unité</span>`));
  line(`<span class="yellow">Gallions disponibles : ${P.money}</span>`);
  renderStatbar();
  const choices=Object.entries(PRIX_POTIONS).map(([n,p])=>[`Acheter ${esc(n)} (${p}G)`, ()=>{
    inputRow(`Quantité de ${n}...`, (v)=>{
      const q=parseInt(v,10);
      if(isNaN(q)||q<=0){ line('<span class="red">❌ Quantité invalide.</span>'); setChoices([["Retour", ()=>screenWitchBuy(retourKey)]]); return; }
      const total=p*q;
      if(P.money<total){ line(`<span class="red">❌ Ta bourse est trop légère ! Il faut ${total} Gallions.</span>`); }
      else if(!addItem(n,"Ressource",q)){ line('<span class="red">❌ Impossible de placer les fioles dans l\'inventaire.</span>'); }
      else { P.money-=total; line(`<span class="yellow">✨ Achat réussi : ${q} x ${esc(n)} pour ${total} Gallions !</span>`); }
      renderStatbar();
      setChoices([["Continuer", ()=>screenWitchBuy(retourKey)]]);
    }, "Acheter");
  }]);
  choices.push(["Retour", ()=>screenWitch(retourKey)]);
  setChoices(choices);
}
